# Repository-root configuration for the merged Delixious monorepo.
# Without "base", Netlify builds frontend/dist but incorrectly publishes
# /opt/build/repo/dist, causing "Deploy directory 'dist' does not exist".
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.0"
  NPM_FLAGS = "--include=dev"

# Always proxy API requests before the React SPA fallback. The browser
# stays on its own origin so stricter privacy settings can retain auth cookies.
[[redirects]]
  from = "/api/*"
  to = "https://delixious-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
